name: Continuous Integration

on:
  push:
    tags:
      - "*"
      - "!**-alpha**"
      - "!**-beta**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    outputs:
      changeLogText: ${{ steps.readChanglog.outputs.text }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags (required for next steps)
        run: git fetch --tags --force

      - name: Get Latest Tag or use TOC version
        id: get_latest_tag
        run: |
          # Отримуємо версію з .toc
          TOC_VERSION=$(grep -oP '^## Version: \K.*' Max_Camera_Distance.toc | cut -d '.' -f1,2)
          TOC_FALLBACK="v${TOC_VERSION}"

          TAGS=$(git tag -l)
          if [ -z "$TAGS" ]; then
            LATEST_TAG="$TOC_FALLBACK"
            echo "⚠️ Теги не знайдено, використовується версія з TOC: $LATEST_TAG"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "🧷 Знайдено останній тег: $LATEST_TAG"
          fi

          echo "FINAL_VERSION=$LATEST_TAG" >> $GITHUB_ENV
          echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT

      # Flavour .toc files are generated from Max_Camera_Distance.toc.
      # Fail the build rather than shipping stale interface versions or a
      # dash-suffixed file that no client will load.
      - name: Verify .toc files are current
        run: python3 tools/generate_tocs.py --check

      # Catches typos and malformed XML in the load manifests before the
      # packager runs. Externals are not fetched yet at this point, so their
      # paths are reported as warnings rather than failures.
      - name: Verify XML manifests (source tree)
        run: python3 tools/verify_manifest.py --allow-missing-externals

      - name: Install Lua 5.1 (probes and bytecode audit)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      # Invoked through bash on purpose. The executable bit is a git file mode,
      # and it does not survive a checkout made on Windows, a zip round-trip, or
      # a file added without `git update-index --chmod=+x`. Depending on it made
      # the gate fail with exit 126 (Permission denied) rather than running.
      - name: Run full pre-release gate
        run: bash ./check_all.sh

      - name: Print Debug Info
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Використана версія: $FINAL_VERSION"

      - name: Update Version in .toc Files
        run: |
          find . -type f -name "*.toc" | while read toc_file; do
            echo "Оновлення версії в файлі: $toc_file"
            sed -i "s/^## Version: .*/## Version: ${FINAL_VERSION}/" "$toc_file"
            echo "✅ Версія в $toc_file оновлено до ${FINAL_VERSION}"
          done

      # Генеруємо changelog тільки для поточного тега
      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --latest: бере зміни тільки для останнього тега
          # --strip header: прибирає заголовок, щоб не дублювати його в описі релізу
          args: --latest --strip header --output CHANGELOG.md

      # Перевіряємо, чи файл створився (для дебагу)
      - name: Verify Changelog
        run: cat CHANGELOG.md
      - name: Create and Upload Package
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
        uses: BigWigsMods/packager@v2

      # The externals are only on disk once the packager has run. This is the
      # step that proves every <Include>/<Script> in the shipped build resolves
      # to a real file - i.e. that Ace3 is actually LOADED and not merely
      # present in libs/.
      - name: Verify XML manifests (packaged artifact)
        run: python3 tools/verify_manifest.py --root .release/Max_Camera_Distance

      - name: Add Summary
        run: |
          echo "## ✅ CI завершено успішно" >> $GITHUB_STEP_SUMMARY

      - name: Notify Discord on Failure
        if: failure()
        uses: nebularg/actions-discord-webhook@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          status: ${{ job.status }}
