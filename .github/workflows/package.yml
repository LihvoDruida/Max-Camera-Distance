name: Continuous Integration

on:
  push:
    tags:
      - "v[0-9]*"
      - "!**-alpha**"
      - "!**-beta**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags (required for next steps)
        run: git fetch --tags --force

      # This workflow runs on tag pushes, not on an arbitrary branch.
      # Never pick an unrelated "latest" tag or fall back to the TOC version.
      - name: Resolve and validate release tag
        id: get_latest_tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "Release tag does not point at the checked-out commit" >&2
            exit 1
          fi
          echo "FINAL_VERSION=$TAG" >> "$GITHUB_ENV"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # Flavor .toc files are generated from Max_Camera_Distance.toc.
      - name: Verify .toc files are current
        run: python3 tools/generate_tocs.py --check

      - name: Verify XML manifests (source, externals fetched during package)
        run: python3 tools/verify_manifest.py --allow-missing-externals

      - name: Install Lua 5.1 (probes and bytecode audit)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run source-only regression gate
        run: bash ./check_all.sh

      - name: Print Debug Info
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Release version: $FINAL_VERSION"

      - name: Update Version in .toc Files
        run: |
          find . -type f -name "*.toc" | while read toc_file; do
            echo "Updating version in: $toc_file"
            sed -i "s/^## Version: .*/## Version: ${FINAL_VERSION}/" "$toc_file"
          done

      # IMPORTANT: --current selects the commits belonging to THIS checked-out
      # tag, whereas --latest can pick a different/latest tag in a repo with
      # multiple release lines. This is the auto-generated release description.
      - name: Generate CHANGELOG.md for current tag
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header --output CHANGELOG.md

      # Prevent publishing an empty, ungrouped or wrong-version release body.
      - name: Validate release description
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${FINAL_VERSION#v}"
          test -s CHANGELOG.md
          grep -Fq "## [$VERSION] - " CHANGELOG.md
          grep -Eq '^[[:space:]]*### [^[:space:]]' CHANGELOG.md
          grep -Eq '^[[:space:]]*- [^[:space:]]' CHANGELOG.md
          if grep -Eq '^[[:space:]]*## \[(Unreleased|unreleased)\]' CHANGELOG.md; then
            echo "Unexpected unreleased section in release notes" >&2
            exit 1
          fi
          cat CHANGELOG.md

      # .pkgmeta manual-changelog points to this generated CHANGELOG.md.
      # Package creation is deliberately kept AFTER generation and validation.
      - name: Create Package (no upload)
        id: package
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Verify packaged files and ZIP (strict, includes downloaded externals)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(.release/Max_Camera_Distance-*.zip)
          if (( ${#archives[@]} != 1 )); then
            printf 'Expected exactly one Max_Camera_Distance ZIP, found %s\n' "${#archives[@]}" >&2
            printf 'Candidates: %s\n' "${archives[*]:-(none)}" >&2
            exit 1
          fi
          python3 tools/verify_manifest.py --root .release/Max_Camera_Distance
          python3 tools/verify_package.py --root .release/Max_Camera_Distance --archive "${archives[0]}"
          (cd .release/Max_Camera_Distance && lua5.1 "$GITHUB_WORKSPACE/tests/probe_libcamera.lua")

      - name: Run full regression gate against the downloaded libraries
        env:
          MCD_PACKAGED_ROOT: ${{ github.workspace }}/.release/Max_Camera_Distance
        run: bash ./check_all.sh

      # Publish only after both source and packaged checks succeeded.
      # BigWigs uses the generated CHANGELOG.md as release notes.
      - name: Upload Verified Package
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: BigWigsMods/packager@v2
        with:
          args: -o -c -e

      - name: Add Summary
        run: |
          echo "## ✅ CI завершено успішно" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated release description from git-cliff for $FINAL_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord on Failure
        if: failure()
        uses: nebularg/actions-discord-webhook@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          status: ${{ job.status }}
