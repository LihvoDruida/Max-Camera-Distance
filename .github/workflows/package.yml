name: Continuous Integration

on:
  push:
    tags:
      - "*"
      - "!**-alpha**"
      - "!**-beta**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags (required for next steps)
        run: git fetch --tags --force

      - name: Get Latest Tag or use TOC version
        id: get_latest_tag
        run: |
          # Отримуємо версію з .toc
          TOC_VERSION=$(grep -oP '^## Version: \K.*' Max_Camera_Distance.toc)
          TOC_FALLBACK="${TOC_VERSION}"

          TAGS=$(git tag -l)
          if [ -z "$TAGS" ]; then
            LATEST_TAG="$TOC_FALLBACK"
            echo "⚠️ Теги не знайдено, використовується версія з TOC: $LATEST_TAG"
          else
            LATEST_TAG="$GITHUB_REF_NAME"
            echo "🧷 Знайдено останній тег: $LATEST_TAG"
          fi

          echo "FINAL_VERSION=$LATEST_TAG" >> $GITHUB_ENV
          echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT

      # Flavour .toc files are generated from Max_Camera_Distance.toc.
      # Fail the build rather than shipping stale interface versions or a
      # dash-suffixed file that no client will load.
      - name: Verify .toc files are current
        run: python3 tools/generate_tocs.py --check

      # .pkgmeta externals are NOT in source. Only verify source-owned files here.
      - name: Verify XML manifests (source, externals fetched during package)
        run: python3 tools/verify_manifest.py --allow-missing-externals

      - name: Install Lua 5.1 (probes and bytecode audit)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      # Invoked through bash on purpose. The executable bit is a git file mode,
      # and it does not survive a checkout made on Windows, a zip round-trip, or
      # a file added without `git update-index --chmod=+x`. Depending on it made
      # the gate fail with exit 126 (Permission denied) rather than running.
      - name: Run source-only regression gate
        run: bash ./check_all.sh

      - name: Print Debug Info
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Використана версія: $FINAL_VERSION"

      - name: Update Version in .toc Files
        run: |
          find . -type f -name "*.toc" | while read toc_file; do
            echo "Оновлення версії в файлі: $toc_file"
            sed -i "s/^## Version: .*/## Version: ${FINAL_VERSION}/" "$toc_file"
            echo "✅ Версія в $toc_file оновлено до ${FINAL_VERSION}"
          done

      # Генеруємо changelog тільки для поточного тега
      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --latest: бере зміни тільки для останнього тега
          # --strip header: прибирає заголовок, щоб не дублювати його в описі релізу
          args: --latest --strip header --output CHANGELOG.md

      # Перевіряємо, чи файл створився (для дебагу)
      - name: Verify Changelog
        run: cat CHANGELOG.md
      - name: Create Package (no upload)
        id: package
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Verify packaged files and ZIP (strict, includes downloaded externals)
        shell: bash
        run: |
          set -euo pipefail
          # BigWigsMods/packager@v2 does not provide archive_path here.
          # Discover the ONE archive that -d actually produced; do not use an
          # empty output that resolves to the repository directory.
          shopt -s nullglob
          archives=(.release/Max_Camera_Distance-*.zip)
          if (( ${#archives[@]} != 1 )); then
            printf 'Expected exactly one Max_Camera_Distance ZIP, found %s\n' "${#archives[@]}" >&2
            printf 'Candidates: %s\n' "${archives[*]:-(none)}" >&2
            exit 1
          fi
          python3 tools/verify_manifest.py --root .release/Max_Camera_Distance
          python3 tools/verify_package.py --root .release/Max_Camera_Distance --archive "${archives[0]}"
          (cd .release/Max_Camera_Distance && lua5.1 "$GITHUB_WORKSPACE/tests/probe_libcamera.lua")

      - name: Run full regression gate against the downloaded libraries
        env:
          MCD_PACKAGED_ROOT: ${{ github.workspace }}/.release/Max_Camera_Distance
        run: bash ./check_all.sh

      # Keep and reuse the verified tree. No copying or external checkout can
      # replace runtime files between validation and publication.
      - name: Upload Verified Package
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: BigWigsMods/packager@v2
        with:
          args: -o -c -e

      - name: Add Summary
        run: |
          echo "## ✅ CI завершено успішно" >> $GITHUB_STEP_SUMMARY

      - name: Notify Discord on Failure
        if: failure()
        uses: nebularg/actions-discord-webhook@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          status: ${{ job.status }}
