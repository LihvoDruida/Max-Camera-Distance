name: Official clients

# Weekly comparison of tools/official_clients.json with Blizzard's public
# version service. A failure means a client patched: update the JSON, run
# tools/generate_tocs.py and review the TOC interface numbers.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compare recorded clients with live versions
        run: python3 tools/check_official_clients.py
