# Release notes are generated automatically on a version tag push, before
# BigWigsMods/packager uploads the verified distribution and creates the release.
[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**[⚠️ Breaking]** {% endif %}{{ commit.message | upper_first | trim }}
    {% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = " # ${2}" },
  { pattern = " +$", replace = "" }
]
commit_parsers = [
  { message = "^feat", group = "🚀 New Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🛠️ Refactor" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^docs?", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^ci", group = "🔧 CI" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore", group = "⚙️ Maintenance" },
  { body = ".*security", group = "🔒 Security" },
  { message = "^revert", group = "⏪ Revert" },
  { message = ".*", group = "📦 Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
ignore_tags = "rc|beta|alpha"
topo_order = false
sort_commits = "newest"
